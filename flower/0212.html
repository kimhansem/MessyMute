      <p id="flowerTitle">2월 12일의 탄생화는 ‘쥐꼬리망초’입니다.</p>
      <p id="flowerBody">쥐꼬리망초는 동아시아 지역이 고향인 친구로 한국, 중국, 일본, 동남아시아 등지의 길가나 밭, 습기가 있는 들판에서 자생하며, 한국에서도 흔히 볼 수 있는 식물입니다. 연한 자홍색의 작고 섬세한 꽃이 피며, 꽃이 지고 난 후 열리는 씨방이 쥐꼬리를 닮았다고 하여 이러한 이름이 붙었습니다. 꽃은 작지만 자세히 보면 매우 정교하고 아름답습니다. 쥐꼬리망초는 작지만 끈질긴 생명력으로 척박한 땅에서도 잘 피어납니다.</p>
