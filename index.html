<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MEMU</title>
  <meta name="apple-mobile-web-app-title" content="MEMU">
  <link rel="stylesheet" href="styles.css">

  <!-- Adobe Typekit -->
  <script>
    (function(d) {
      var config = { kitId: 'xca0zac', scriptTimeout: 3000, async: true },
      h=d.documentElement,t=setTimeout(function(){h.className=h.className.replace(/\bwf-loading\b/g,"")+" wf-inactive";},config.scriptTimeout),
      tk=d.createElement("script"),f=false,s=d.getElementsByTagName("script")[0],a;
      h.className+=" wf-loading";tk.src='https://use.typekit.net/'+config.kitId+'.js';tk.async=true;
      tk.onload=tk.onreadystatechange=function(){a=this.readyState;if(f||a&&a!="complete"&&a!="loaded")return;
      f=true;clearTimeout(t);try{Typekit.load(config)}catch(e){}};s.parentNode.insertBefore(tk,s)
    })(document);
  </script>
  
<link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="shortcut icon" href="/favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
<link rel="manifest" href="/site.webmanifest" />
</head>

<body class="main-bg">
  <!-- 1 메인 -->
  <div id="mainPage">
    <div id="message">당신의 탄생화는 무엇인가요?</div>
    <input type="text" id="dateInput" placeholder="생일을 입력해주세요 ex) 0123" class="custom-input">
    <button id="confirmBtn">enter</button>
  </div>

  <!-- 2 상-세 -->
  <div id="detailPage" style="display:none;">
    <img id="flowerImage" src="">
    <div class="textBox">
      <p id="flowerTitle"></p>
      <p id="flowerBody"></p>
      <p id="flowerClosing"></p>
      <div id="btnBox">
        <button id="goMainBtn1">main</button>
        <button id="goGalleryBtn">see all</button>
        <button id="goLinkBtn">download</button>
      </div>
    </div>
  </div>

  <!-- 3 갤러리 -->
  <div id="galleryPage" style="display:none;">
    <button id="goMainBtn2">main</button>
    <div class="gallery-grid" id="galleryGrid"></div>
  </div>

<script>
let flowerData = [];

window.onload = () => {
  fetch('flowers.json')
    .then(response => response.json())
    .then(data => { flowerData = data; });

  document.getElementById('confirmBtn').addEventListener('click', () => showFlower());
  document.getElementById('goMainBtn1').addEventListener('click', goMain);
  document.getElementById('goMainBtn2').addEventListener('click', goMain);
  document.getElementById('goGalleryBtn').addEventListener('click', showGallery);
};

function showFlower(date) {
  const input = date || document.getElementById('dateInput').value.trim();
  if (!/^\d{4}$/.test(input)) {
    alert("날짜 형식이 올바르지 않습니다. 예: 0103");
    return;
  }

  const data = flowerData.find(f => f.date === input);

  document.getElementById('mainPage').style.display = 'none';
  document.getElementById('galleryPage').style.display = 'none';
  document.getElementById('detailPage').style.display = '';
  document.body.className = 'detail-bg';
  window.scrollTo(0, 0);

  const img = document.getElementById('flowerImage');
  const title = document.getElementById('flowerTitle');
  const body = document.getElementById('flowerBody');
  const closing = document.getElementById('flowerClosing');
  const linkBtn = document.getElementById('goLinkBtn');

  [img, title, body, closing].forEach(el => {
    el.classList.remove('enter');
    el.classList.add('hidden');
  });

  if (data) {
    title.textContent = data.title;
    body.textContent = data.body;
    closing.textContent = data.closing;

    if (data.link) {
      linkBtn.style.display = 'inline-block';
      linkBtn.onclick = () => window.open(data.link, '_blank');
    } else {
      linkBtn.style.display = 'none';
    }
  } else {
    title.textContent = "해당 날짜의 꽃 설명이 없습니다.";
    body.textContent = "";
    closing.textContent = "";
    linkBtn.style.display = 'none';
  }

  function startAnimation() {
    const elements = [img, title, body, closing];
    const delay = 250;
    elements.forEach((el, index) => {
      setTimeout(() => {
        requestAnimationFrame(() => {
          el.classList.remove('hidden');
          el.classList.add('enter');
        });
      }, delay * index);
    });
  }

  function handleReady(src) {
    img.src = src;
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(startAnimation);
    } else {
      setTimeout(startAnimation, 100);
    }
  }

  const preloadImg = new Image();
  let settled = false;

  preloadImg.onload = () => {
    if (settled) return;
    settled = true;
    handleReady(preloadImg.src);
  };
  preloadImg.onerror = () => {
    if (settled) return;
    settled = true;
    img.src = preloadImg.src;
    startAnimation();
  };

  preloadImg.src = `img/${input}.jpg`;

  if (preloadImg.complete) {
    if (preloadImg.naturalWidth > 0) {
      if (!settled) { settled = true; handleReady(preloadImg.src); }
    } else {
      if (!settled) { settled = true; img.src = preloadImg.src; startAnimation(); }
    }
  }
}

// 갤러리 페이지 표시
function showGallery() {
  document.getElementById('mainPage').style.display = 'none';
  document.getElementById('detailPage').style.display = 'none';
  document.getElementById('galleryPage').style.display = 'block';
  document.body.className = 'gallery-bg';
  window.scrollTo(0, 0);

  const grid = document.getElementById('galleryGrid');
  grid.innerHTML = '';

  flowerData.forEach((f, index) => {
    const thumb = document.createElement('img');
    thumb.src = `img/thumb/${f.date}.jpg`;
    thumb.alt = f.date;
    thumb.loading = 'lazy';
    thumb.setAttribute('role', 'button');
    thumb.setAttribute('tabindex', '0');

    // iOS Safari에서 img의 click 이벤트가 누락되는 경우를 대비해
    // touchend도 함께 처리합니다. 짧은 시간 내 중복 실행은 방지합니다.
    let lastActivation = 0;
    const activateThumb = (event) => {
      const now = Date.now();
      if (now - lastActivation < 500) return;
      lastActivation = now;
      if (event.type === 'touchend') event.preventDefault();
      showFlower(f.date);
    };
    thumb.addEventListener('click', activateThumb);
    thumb.addEventListener('touchend', activateThumb, { passive: false });
    thumb.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        activateThumb(event);
      }
    });

    thumb.classList.remove('enter');
    grid.appendChild(thumb);

    thumb.onload = () => {
      setTimeout(() => {
        thumb.classList.add('enter');
      }, 40 + index * 40);
    };
  });
}

function goMain() {
  document.getElementById('detailPage').style.display = 'none';
  document.getElementById('galleryPage').style.display = 'none';
  document.getElementById('mainPage').style.display = '';
  document.body.className = 'main-bg';
  document.getElementById('dateInput').value = '';
  window.scrollTo(0, 0);
}
</script>
</body>
</html>
